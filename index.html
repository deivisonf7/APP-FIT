<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fit Tracker</title>
    <style>
        :root {
            --bg-main: #000000;
            --bg-card: #121214;
            --bg-input: #1a1a1e;
            --color-primary: #0a84ff;
            --color-success: #30d158;
            --text-main: #ffffff;
            --text-dark: #8e8e93;
            --border-line: #222224;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        .app-header {
            background-color: rgba(18, 18, 20, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid var(--border-line);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .main-container {
            padding: 16px;
        }

        .app-page {
            display: none;
        }

        .app-page.active {
            display: block;
        }

        .days-navigation {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .day-tab-button {
            background-color: var(--bg-card);
            border: 1px solid var(--border-line);
            color: var(--text-dark);
            padding: 12px 0;
            font-size: 13px;
            border-radius: 10px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .day-tab-button.active {
            background-color: var(--color-primary);
            color: var(--text-main);
            border-color: var(--color-primary);
        }

        .workout-content-block {
            display: none;
        }

        .workout-content-block.active {
            display: block;
        }

        .focus-badge-title {
            font-size: 13px;
            color: var(--text-dark);
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .exercise-item-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .exercise-main-row {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .custom-checkbox-input {
            width: 24px;
            height: 24px;
            accent-color: var(--color-success);
            cursor: pointer;
            margin-top: 2px;
        }

        .exercise-details {
            flex: 1;
        }

        .exercise-name-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .exercise-meta-info {
            font-size: 13px;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .muscle-tag {
            font-size: 11px;
            background-color: rgba(10, 132, 255, 0.12);
            color: #64b5f6;
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-block;
            font-weight: 600;
        }

        .weight-fields-grid {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border-line);
        }

        .weight-text-field {
            background-color: var(--bg-input);
            border: 1px solid var(--border-line);
            border-radius: 8px;
            color: var(--text-main);
            padding: 8px 12px;
            width: 50%;
            font-size: 13px;
        }

        .video-guide-button {
            margin-top: 12px;
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--color-primary);
            border: 1px solid var(--border-line);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .bottom-navigation-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 72px;
            background-color: rgba(18, 18, 20, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-line);
            display: flex;
            z-index: 1000;
        }

        .nav-tab-item {
            background: none;
            border: none;
            color: var(--text-dark);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 1;
            cursor: pointer;
        }

        .nav-tab-item.active {
            color: var(--color-primary);
        }

        .nav-tab-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1 id="dynamic-app-title">Meus Treinos</h1>
    </header>

    <div class="main-container">
        
        <!-- PÁGINA PRINCIPAL: LISTA DE TREINOS -->
        <div id="page-content-workouts" class="app-page active">
            
            <!-- Abas Superiores de Alternância -->
            <div class="days-navigation">
                <button class="day-tab-button active" data-day="1">DIA 1</button>
                <button class="day-tab-button" data-day="2">DIA 2</button>
                <button class="day-tab-button" data-day="3">DIA 3</button>
                <button class="day-tab-button" data-day="4">DIA 4</button>
            </div>

            <!-- CONTEÚDO: DIA 1 -->
            <div id="workout-block-day-1" class="workout-content-block active">
                <h2 class="focus-badge-title">Foco: Bíceps e Tríceps</h2>
                
                <div class="exercise-item-card">
                    <div class="exercise-main-row">
                        <div><input type="checkbox" class="custom-checkbox-input" data-storage-id="chk-d1-e1"></div>
                        <div class="exercise-details">
                            <h3 class="exercise-name-title">Rosca Direta Barra Reta</h3>
                            <p class="exercise-meta-info">3 Séries x 12 Repetições</p>
                            <span class="muscle-tag">Bíceps</span>
                        </div>
                    </div>
                    <div class="weight-fields-grid">
                        <input type="text" class="weight-text-field" data-storage-id="w-d1-e1" placeholder="Carga (kg)">
                        <input type="text" class="weight-text-field" data-storage-id="o-d1-e1" placeholder="Anotações">
                    </div>
                    <a href="https://youtube.com" target="_blank" class="video-guide-button">Ver Execução</a>
                </div>
            </div>

            <!-- CONTEÚDO: DIA 2 -->
            <div id="workout-block-day-2" class="workout-content-block">
                <h2 class="focus-badge-title">Foco: Costas e Dorsais</h2>
                
                <div class="exercise-item-card">
                    <div class="exercise-main-row">
                        <div><input type="checkbox" class="custom-checkbox-input" data-storage-id="chk-d2-e1"></div>
                        <div class="exercise-details">
                            <h3 class="exercise-name-title">Puxada Alta Pulley</h3>
                            <p class="exercise-meta-info">4 Séries x 12 Repetições</p>
                            <span class="muscle-tag">Costas</span>
                        </div>
                    </div>
                    <div class="weight-fields-grid">
                        <input type="text" class="weight-text-field" data-storage-id="w-d2-e1" placeholder="Carga (kg)">
                        <input type="text" class="weight-text-field" data-storage-id="o-d2-e1" placeholder="Anotações">
                    </div>
                    <a href="https://youtube.com" target="_blank" class="video-guide-button">Ver Execução</a>
                </div>
            </div>

            <!-- CONTEÚDO: DIA 3 -->
            <div id="workout-block-day-3" class="workout-content-block">
                <h2 class="focus-badge-title">Foco: Peitoral e Ombros</h2>
                
                <div class="exercise-item-card">
                    <div class="exercise-main-row">
                        <div><input type="checkbox" class="custom-checkbox-input" data-storage-id="chk-d3-e1"></div>
                        <div class="exercise-details">
                            <h3 class="exercise-name-title">Supino Reto com Halteres</h3>
                            <p class="exercise-meta-info">4 Séries x 10 Repetições</p>
                            <span class="muscle-tag">Peito</span>
                        </div>
                    </div>
                    <div class="weight-fields-grid">
